<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table</title>

    <style>
        table {
            border: 2px solid gray;
            padding: 5px;
            width: 300px;
            text-align: center;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
        }

        .green {
            background-color: green;
        }

        .city {
            color: brown;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="2">name</th>
            <th rowspan="2">Address</th>
        </tr>

        <tr>
            <th>First</th>
            <th>Last</th>
        </tr>

        <tr>
            <td colspan="3" class="green">
                All the data is here
            </td>
        </tr>

        <tr>
            <td colspan="2" rowspan="2">Hamada</td>
            <td class="city">cairo</td>
        </tr>

        <tr>
            <td>
                At vero eos et accusamus et iusto odio dignissimos
                ducimus qui blanditiis
            </td>
        </tr>
    </table>

</body>
</html>
